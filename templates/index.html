<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Study Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        #subject {
            margin-top: 12px;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            background: white;
            cursor: pointer;
        }

        .chat-box {
            height: 350px;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            background: #fafafa;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
        }

        .user {
            background: #4f46e5;
            color: white;
            margin-left: auto;
        }

        .bot {
            background: #e5e7eb;
            color: #222;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #question {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        #question:focus {
            border-color: #4f46e5;
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .welcome {
            text-align: center;
            color: #777;
            margin-top: 120px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌸 Della</h1>

        <div class="subtitle">
            <p>Your AI Companion</p>

            <select id="subject">
                <option value="General">📚 General</option>
                <option value="Computer Networks">🌐 Computer Networks</option>
                <option value="DBMS">🗄️ DBMS</option>
                <option value="Java / OOP">☕ Java / OOP</option>
                <option value="Operating System">💻 Operating System</option>
                <option value="Probability & Statistics">📊 Probability & Statistics</option>
                <option value="AI / ML">🤖 AI / ML</option>
                <option value="Economics for Engineers">📈 Economics for Engineers</option>
            </select>
        </div>

        <div class="chat-box" id="chatBox">

            <div class="welcome" id="welcome">
                <p>📚 Welcome to your AI Study Assistant!</p>
                <br>
                <p>Select a subject and ask a question to get started.</p>
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Type your question here..."
                onkeydown="handleEnter(event)"
            >

            <button onclick="askQuestion()">
                Ask
            </button>

        </div>

    </div>


    <script>

        function handleEnter(event) {

            if (event.key === "Enter") {
                askQuestion();
            }

        }


        async function askQuestion() {

            const input = document.getElementById("question");
            const chatBox = document.getElementById("chatBox");
            const welcome = document.getElementById("welcome");
            const subject = document.getElementById("subject").value;

            const question = input.value.trim();

            if (question === "") {
                return;
            }

            if (welcome) {
                welcome.remove();
            }

            // Show user's question
            const userMessage = document.createElement("div");

            userMessage.className = "message user";

            userMessage.textContent = question;

            chatBox.appendChild(userMessage);

            input.value = "";

            chatBox.scrollTop = chatBox.scrollHeight;


            try {

                const response = await fetch("/ask", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question,
                        subject: subject
                    })

                });


                const data = await response.json();


                // Show AI answer
                const botMessage = document.createElement("div");

                botMessage.className = "message bot";

                botMessage.textContent = data.answer;

                chatBox.appendChild(botMessage);

                chatBox.scrollTop = chatBox.scrollHeight;

            }

            catch (error) {

                const errorMessage = document.createElement("div");

                errorMessage.className = "message bot";

                errorMessage.textContent =
                    "Sorry, something went wrong. Please try again.";

                chatBox.appendChild(errorMessage);

                console.error(error);

            }

        }

    </script>

</body>
</html>
